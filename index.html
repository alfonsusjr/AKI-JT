<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalkulator Kelayakan Pengajuan JT Madiun</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}

.container{
    max-width:550px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#333;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#444;
}

input, select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:20px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#0066ff;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0052cc;
}

.result{
    margin-top:25px;
    padding:20px;
    border-radius:10px;
    background:#f7f7f7;
    display:none;
}

.success{
    color:green;
    font-weight:bold;
    font-size:20px;
}

.danger{
    color:red;
    font-weight:bold;
    font-size:20px;
}

.item{
    margin-bottom:12px;
    font-size:16px;
}

</style>
</head>

<body>

<div class="container">

    <h1>Kalkulator Kelayakan Pengajuan JT Madiun</h1>

    <label>Total RAB</label>
    <input type="text" id="rab" placeholder="Contoh: 20.000.000">

    <label>Tagihan Bulanan</label>
    <input type="text" id="tagihan" placeholder="Contoh: 2.500.000">

    <label>Pilih Kontrak / Tahun</label>
    <select id="tahun">
        <option value="12">1 Tahun (12 Bulan)</option>
        <option value="24">2 Tahun (24 Bulan)</option>
        <option value="36">3 Tahun (36 Bulan)</option>
    </select>

    <button onclick="hitungAKI()">Hitung Analisa</button>

    <div class="result" id="resultBox">

        <div class="item" id="hasilRab"></div>

        <div class="item" id="hasilTagihan"></div>

        <div class="item" id="hasilKontrak"></div>

        <div class="item" id="hasilRevenue"></div>

        <div class="item" id="hasilPersentase"></div>

        <div class="item" id="hasilStatus"></div>

    </div>

</div>

<script>

// FORMAT ANGKA DENGAN TITIK
function formatAngka(angka){

    return angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

// AMBIL ANGKA ASLI
function ambilAngka(value){

    return parseInt(value.replace(/\D/g, "")) || 0;
}

// FORMAT INPUT OTOMATIS
function formatInput(id){

    let input = document.getElementById(id);

    input.addEventListener("keyup", function(){

        let angka = ambilAngka(this.value);

        this.value = formatAngka(angka);

    });
}

// AKTIFKAN FORMAT
formatInput("rab");
formatInput("tagihan");

// HITUNG AKI
function hitungAKI(){

    let rab = ambilAngka(document.getElementById("rab").value);

    let tagihan = ambilAngka(document.getElementById("tagihan").value);

    let bulan = parseInt(document.getElementById("tahun").value);

    // VALIDASI
    if(rab <= 0 || tagihan <= 0){

        alert("Mohon isi data dengan benar");

        return;
    }

    // HITUNG REVENUE
    let revenue = tagihan * bulan;

    // HITUNG PERSENTASE
    let persentase = (rab / revenue) * 100;

    let status = "";
    let classStatus = "";

    // STATUS KELAYAKAN
    if(persentase <= 30){

        status = "LAYAK";
        classStatus = "success";

    }else{

        status = "TIDAK LAYAK";
        classStatus = "danger";
    }

    // TAMPILKAN HASIL
    document.getElementById("resultBox").style.display = "block";

    document.getElementById("hasilRab").innerHTML =
        "<b>Total RAB:</b> Rp " + formatAngka(rab);

    document.getElementById("hasilTagihan").innerHTML =
        "<b>Tagihan Bulanan:</b> Rp " + formatAngka(tagihan);

    document.getElementById("hasilKontrak").innerHTML =
        "<b>Masa Kontrak:</b> " + bulan + " Bulan";

    document.getElementById("hasilRevenue").innerHTML =
        "<b>Total Revenue:</b> Rp " + formatAngka(revenue);

    document.getElementById("hasilPersentase").innerHTML =
        "<b>Persentase AKI:</b> " + persentase.toFixed(2) + "%";

    document.getElementById("hasilStatus").innerHTML =
        "<b>Status:</b> <span class='" + classStatus + "'>" + status + "</span>";
}

</script>

</body>
</html>
