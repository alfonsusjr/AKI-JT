<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalkulator Kelayakan Pengajuan JT</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}

.container{
    max-width:500px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#333;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#444;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:20px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#0066ff;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0052cc;
}

.result{
    margin-top:25px;
    padding:20px;
    border-radius:10px;
    background:#f7f7f7;
    display:none;
}

.success{
    color:green;
    font-weight:bold;
}

.danger{
    color:red;
    font-weight:bold;
}

.item{
    margin-bottom:10px;
}

</style>
</head>

<body>

<div class="container">

    <h1>Kalkulator Kelayakan Pengajuan JT</h1>

    <label>Total RAB</label>
    <input type="number" id="rab" placeholder="Contoh: 20000000">

    <label>Total Revenue</label>
    <input type="number" id="revenue" placeholder="Contoh: 100000000">

    <button onclick="hitungAKI()">Hitung Analisa</button>

    <div class="result" id="resultBox">
        <div class="item" id="hasilRab"></div>
        <div class="item" id="hasilRevenue"></div>
        <div class="item" id="hasilPersentase"></div>
        <div class="item" id="hasilStatus"></div>
    </div>

</div>

<script>

function formatRupiah(angka){
    return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR'
    }).format(angka);
}

function hitungAKI(){

    let rab = parseFloat(document.getElementById('rab').value);
    let revenue = parseFloat(document.getElementById('revenue').value);

    if(isNaN(rab) || isNaN(revenue) || revenue <= 0){

        alert('Mohon isi data dengan benar');

        return;
    }

    let persentase = (rab / revenue) * 100;

    let status = '';
    let classStatus = '';

    if(persentase <= 30){

        status = 'LAYAK';
        classStatus = 'success';

    }else{

        status = 'TIDAK LAYAK';
        classStatus = 'danger';
    }

    document.getElementById('resultBox').style.display = 'block';

    document.getElementById('hasilRab').innerHTML =
        '<b>Total RAB:</b> ' + formatRupiah(rab);

    document.getElementById('hasilRevenue').innerHTML =
        '<b>Total Revenue:</b> ' + formatRupiah(revenue);

    document.getElementById('hasilPersentase').innerHTML =
        '<b>Persentase AKI:</b> ' + persentase.toFixed(2) + '%';

    document.getElementById('hasilStatus').innerHTML =
        '<b>Status:</b> <span class="' + classStatus + '">' + status + '</span>';
}

</script>

</body>
</html>
